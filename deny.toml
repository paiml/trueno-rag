# cargo-deny configuration (v0.18+)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Transitive deps via trueno-db → parquet; can't upgrade without upstream releases
ignore = [
    "RUSTSEC-2026-0007", # bytes: integer overflow in BytesMut::reserve (transitive via parquet)
    "RUSTSEC-2024-0436", # paste: unmaintained (transitive via parquet)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
